<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="GameZone Logo">
  <defs>
    <linearGradient id="gz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="50%" stop-color="#0072ce" />
      <stop offset="100%" stop-color="#6744e8" />
    </linearGradient>
    <linearGradient id="gz-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="gz-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0072ce" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Badge -->
  <polygon points="50,6 88,24 88,76 50,94 12,76 12,24" fill="#061224" stroke="url(#gz-grad)" stroke-width="4" stroke-linejoin="round" filter="url(#gz-shadow)" />

  <!-- Inner Cyber Accent Line -->
  <polygon points="50,14 80,29 80,71 50,86 20,71 20,29" fill="none" stroke="url(#gz-glow)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 4" />

  <!-- Stylized Gamepad Silhouette -->
  <path d="M32 40 C32 35, 36 32, 44 32 L56 32 C64 32, 68 35, 68 40 C68 44, 71 58, 66 65 C63 69, 58 68, 55 64 L52 60 L48 60 L45 64 C42 68, 37 69, 34 65 C29 58, 32 44, 32 40 Z" fill="url(#gz-grad)" />

  <!-- D-Pad (Left) -->
  <rect x="38" y="44" width="4" height="10" rx="1.5" fill="#ffffff" />
  <rect x="35" y="47" width="10" height="4" rx="1.5" fill="#ffffff" />

  <!-- Action Buttons (Right) -->
  <circle cx="61" cy="46" r="2" fill="#ffffff" />
  <circle cx="57" cy="50" r="2" fill="#ffffff" />
  <circle cx="65" cy="50" r="2" fill="#ffffff" />
  <circle cx="61" cy="54" r="2" fill="#ffffff" />

  <!-- Center Status LED -->
  <circle cx="50" cy="43" r="1.75" fill="#00f2fe" />
  <polygon points="50,47 52,50 48,50" fill="#00f2fe" />
</svg>
